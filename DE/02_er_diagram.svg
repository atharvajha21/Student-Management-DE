<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
      .field-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #334155; }
      .field-type { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #64748b; }
      .pk-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #e11d48; }
      .fk-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #2563eb; }
      .uk-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #d97706; }
      .rel-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .card-label { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12px; font-weight: 700; fill: #0f172a; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="crow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 M 8 1 L 8 9" fill="none" stroke="#475569" stroke-width="1.5" />
    </marker>
    <marker id="one" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 4 1 L 4 9 M 8 1 L 8 9" fill="none" stroke="#475569" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" fill="#f8fafc" />

  <!-- Title Block -->
  <text x="50" y="45" class="title">Student Management System — Entity Relationship (ER) Diagram</text>
  <text x="50" y="70" class="subtitle">Relational Schema with 3NF Normalization, Constraints &amp; Cardinalities (PostgreSQL 17)</text>

  <!-- TABLE 1: STUDENTS -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="320" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 312 0 Q 320 0 320 8 L 320 40 L 0 40 Z" fill="#0f766e" />
    <text x="16" y="26" class="header-text">STUDENTS</text>
    
    <!-- Rows -->
    <text x="16" y="65" class="field-text">student_id</text><text x="110" y="65" class="pk-badge">[PK]</text><text x="150" y="65" class="field-type">SERIAL</text>
    <line x1="0" y1="75" x2="320" y2="75" stroke="#f1f5f9" />
    <text x="16" y="95" class="field-text">name</text><text x="150" y="95" class="field-type">VARCHAR(100) NOT NULL</text>
    <line x1="0" y1="105" x2="320" y2="105" stroke="#f1f5f9" />
    <text x="16" y="125" class="field-text">email</text><text x="80" y="125" class="uk-badge">[UQ]</text><text x="150" y="125" class="field-type">VARCHAR(150) NOT NULL</text>
    <line x1="0" y1="135" x2="320" y2="135" stroke="#f1f5f9" />
    <text x="16" y="155" class="field-text">phone</text><text x="150" y="155" class="field-type">VARCHAR(15) NULL</text>
    <line x1="0" y1="165" x2="320" y2="165" stroke="#f1f5f9" />
    <text x="16" y="185" class="field-text">department</text><text x="150" y="185" class="field-type">VARCHAR(100) NOT NULL</text>
    <line x1="0" y1="195" x2="320" y2="195" stroke="#f1f5f9" />
    <text x="16" y="215" class="field-text">created_at</text><text x="150" y="215" class="field-type">TIMESTAMP DEFAULT NOW</text>
  </g>

  <!-- TABLE 2: COURSES -->
  <g transform="translate(50, 420)" filter="url(#shadow)">
    <rect width="320" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 312 0 Q 320 0 320 8 L 320 40 L 0 40 Z" fill="#1e40af" />
    <text x="16" y="26" class="header-text">COURSES</text>

    <!-- Rows -->
    <text x="16" y="65" class="field-text">course_id</text><text x="105" y="65" class="pk-badge">[PK]</text><text x="150" y="65" class="field-type">SERIAL</text>
    <line x1="0" y1="75" x2="320" y2="75" stroke="#f1f5f9" />
    <text x="16" y="95" class="field-text">course_name</text><text x="150" y="95" class="field-type">VARCHAR(100) NOT NULL</text>
    <line x1="0" y1="105" x2="320" y2="105" stroke="#f1f5f9" />
    <text x="16" y="125" class="field-text">course_code</text><text x="110" y="125" class="uk-badge">[UQ]</text><text x="150" y="125" class="field-type">VARCHAR(20) NOT NULL</text>
    <line x1="0" y1="135" x2="320" y2="135" stroke="#f1f5f9" />
    <text x="16" y="155" class="field-text">credits</text><text x="150" y="155" class="field-type">INT CHECK(1..6)</text>
    <line x1="0" y1="165" x2="320" y2="165" stroke="#f1f5f9" />
    <text x="16" y="180" class="subtitle" style="font-size:11px;">(Relational Entity for Course Offerings)</text>
  </g>

  <!-- TABLE 3: ENROLLMENTS (JUNCTION TABLE) -->
  <g transform="translate(450, 230)" filter="url(#shadow)">
    <rect width="320" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 312 0 Q 320 0 320 8 L 320 40 L 0 40 Z" fill="#7c3aed" />
    <text x="16" y="26" class="header-text">ENROLLMENTS (Junction Table)</text>

    <!-- Rows -->
    <text x="16" y="65" class="field-text">enrollment_id</text><text x="130" y="65" class="pk-badge">[PK]</text><text x="170" y="65" class="field-type">SERIAL</text>
    <line x1="0" y1="75" x2="320" y2="75" stroke="#f1f5f9" />
    <text x="16" y="95" class="field-text">student_id</text><text x="110" y="95" class="fk-badge">[FK]</text><text x="170" y="95" class="field-type">INT (students)</text>
    <line x1="0" y1="105" x2="320" y2="105" stroke="#f1f5f9" />
    <text x="16" y="125" class="field-text">course_id</text><text x="105" y="125" class="fk-badge">[FK]</text><text x="170" y="125" class="field-type">INT (courses)</text>
    <line x1="0" y1="135" x2="320" y2="135" stroke="#f1f5f9" />
    <text x="16" y="155" class="field-text">enrollment_date</text><text x="170" y="155" class="field-type">DATE DEFAULT NOW</text>
    <line x1="0" y1="165" x2="320" y2="165" stroke="#f1f5f9" />
    <text x="16" y="185" class="field-text">UNIQUE(student_id, course_id)</text>
    <line x1="0" y1="195" x2="320" y2="195" stroke="#f1f5f9" />
    <text x="16" y="212" class="subtitle" style="font-size:11px;">ON DELETE CASCADE (Referential Integrity)</text>
  </g>

  <!-- TABLE 4: ATTENDANCE -->
  <g transform="translate(850, 230)" filter="url(#shadow)">
    <rect width="210" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 202 0 Q 210 0 210 8 L 210 40 L 0 40 Z" fill="#b45309" />
    <text x="16" y="26" class="header-text">ATTENDANCE</text>

    <!-- Rows -->
    <text x="16" y="65" class="field-text">attendance_id</text><text x="125" y="65" class="pk-badge">[PK]</text>
    <text x="16" y="80" class="field-type">SERIAL</text>
    <line x1="0" y1="88" x2="210" y2="88" stroke="#f1f5f9" />
    <text x="16" y="108" class="field-text">enrollment_id</text><text x="125" y="108" class="fk-badge">[FK]</text>
    <text x="16" y="123" class="field-type">INT (enrollments)</text>
    <line x1="0" y1="131" x2="210" y2="131" stroke="#f1f5f9" />
    <text x="16" y="151" class="field-text">attendance_date</text>
    <text x="16" y="166" class="field-type">DATE NOT NULL</text>
    <line x1="0" y1="174" x2="210" y2="174" stroke="#f1f5f9" />
    <text x="16" y="194" class="field-text">status</text>
    <text x="16" y="209" class="field-type">CHECK (Present/Absent)</text>
  </g>

  <!-- RELATIONSHIP LINES -->
  <!-- Students to Enrollments -->
  <path d="M 370 230 L 410 230 L 410 320 L 450 320" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)" />
  <rect x="380" y="260" width="55" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="388" y="274" class="card-label">1 : N</text>

  <!-- Courses to Enrollments -->
  <path d="M 370 520 L 410 520 L 410 380 L 450 380" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)" />
  <rect x="380" y="440" width="55" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="388" y="454" class="card-label">1 : N</text>

  <!-- Enrollments to Attendance -->
  <path d="M 770 345 L 850 345" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)" />
  <rect x="790" y="325" width="45" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="797" y="339" class="card-label">1 : N</text>

  <!-- Key Legend Block -->
  <g transform="translate(450, 500)">
    <rect width="610" height="120" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="16" y="24" style="font-family:sans-serif; font-size:13px; font-weight:700; fill:#1e293b;">RELATIONAL ARCHITECTURE &amp; INTEGRITY RULES</text>
    <text x="16" y="48" style="font-family:sans-serif; font-size:12px; fill:#475569;">• Students ↔ Courses: Many-to-Many resolved through Enrollments associative table (3NF compliant).</text>
    <text x="16" y="68" style="font-family:sans-serif; font-size:12px; fill:#475569;">• Enrollments ↔ Attendance: 1-to-Many; unique daily attendance per enrollment prevents duplicates.</text>
    <text x="16" y="88" style="font-family:sans-serif; font-size:12px; fill:#475569;">• Referential Actions: ON DELETE CASCADE propagates from Students/Courses → Enrollments → Attendance.</text>
    <text x="16" y="108" style="font-family:sans-serif; font-size:12px; fill:#475569;">• Domain Integrity: CHECK constraints enforce credits (1-6) and attendance status ('Present' | 'Absent').</text>
  </g>
</svg>
